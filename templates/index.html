<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA Security Checker | Fermat Attack Analysis</title>
    <!-- ใช้ Tailwind CSS สำหรับดีไซน์สุดล้ำ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ใช้ฟอนต์ Prompt และ Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .font-mono { font-family: 'Fira Code', monospace; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .glow-btn { box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); transition: all 0.3s ease; }
        .glow-btn:hover { box-shadow: 0 0 25px rgba(56, 189, 248, 0.8); transform: translateY(-2px); }
        /* ซ่อนลูกศรใน input number */
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Background Grid Pattern -->
    <div class="absolute inset-0 z-0 opacity-20" style="background-image: linear-gradient(#334155 1px, transparent 1px), linear-gradient(90deg, #334155 1px, transparent 1px); background-size: 40px 40px;"></div>
    
    <div class="glass-panel w-full max-w-2xl rounded-2xl p-8 relative z-10 shadow-2xl">
        <!-- Header -->
        <div class="text-center mb-10">
            <div class="inline-block p-4 rounded-full bg-slate-800 mb-4 border border-slate-700">
                <svg class="w-10 h-10 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">RSA Security Checker</h1>
            <p class="text-slate-400 mt-2">วิเคราะห์ความปลอดภัยด้วย Fermat's Factorization Attack</p>
        </div>

        <!-- Form -->
        <form id="checkForm" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-cyan-300 mb-2">ค่า n (กุญแจสาธารณะ)</label>
                <input type="text" id="n" required placeholder="เช่น 16867 หรือ 12345678901234567" 
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 font-mono transition-colors">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-cyan-300 mb-2 flex justify-between">
                    <span>ระยะห่าง p, q (D%)</span>
                    <span class="text-slate-500 font-normal">0 = ใกล้, 100 = ไกล</span>
                </label>
                <input type="number" id="D" value="50" min="0" max="100"
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 font-mono transition-colors">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold py-4 rounded-lg glow-btn flex justify-center items-center gap-2">
                <span>เริ่มการตรวจสอบ</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </button>
        </form>

        <!-- Result Box (ซ่อนไว้จนกว่าจะกดตรวจ) -->
        <div id="resultBox" class="hidden mt-8 animate-[fadeIn_0.5s_ease-in-out]">
            <hr class="border-slate-700 mb-6">
            
            <div class="flex flex-col md:flex-row items-center gap-6">
                <!-- Circular Score Gauge -->
                <div class="relative w-32 h-32 flex-shrink-0">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="#1e293b" stroke-width="8"></circle>
                        <circle id="scoreCircle" cx="50" cy="50" r="45" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="283" stroke-dashoffset="283" class="transition-all duration-1000 ease-out"></circle>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span id="scoreText" class="text-2xl font-bold font-mono">0</span>
                        <span class="text-[10px] text-slate-400">SCORE</span>
                    </div>
                </div>

                <!-- Text Result -->
                <div class="flex-1 text-center md:text-left w-full">
                    <h3 id="resMsg" class="text-2xl font-bold mb-2">-</h3>
                    <div id="exactBadge" class="hidden inline-block px-3 py-1 rounded text-xs font-bold bg-green-900 text-green-300 border border-green-700 mb-3">
                        ✨ คำนวณจริง (Exact)
                    </div>
                    <div id="expList" class="text-sm text-slate-300 space-y-2 text-left bg-slate-900/50 p-4 rounded-lg border border-slate-800 font-mono">
                        <!-- รายละเอียดจะถูกเติมด้วย JS -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Footer Links -->
        <div class="mt-10 pt-6 border-t border-slate-800 flex justify-center gap-6">
            <a href="/dashboard" class="text-sm text-slate-400 hover:text-cyan-400 transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                ดูฐานข้อมูล (Dashboard)
            </a>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        document.getElementById('checkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-pulse">กำลังประมวลผล...</span>`;
            
            const n = document.getElementById('n').value.trim();
            const D = document.getElementById('D').value;
            
            try {
                const res = await fetch('/api/check', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({n: n, D: parseInt(D)})
                });
                const data = await res.json();
                
                if (data.status === 'error') { alert(data.msg); return; }
                
                // แสดงผลลัพธ์
                const box = document.getElementById('resultBox');
                box.classList.remove('hidden');
                
                // เปลี่ยนสีตามระดับความปลอดภัย
                const colors = {
                    'danger': { text: 'text-red-400', circle: '#ef4444' },
                    'warning': { text: 'text-orange-400', circle: '#f97316' },
                    'moderate': { text: 'text-yellow-400', circle: '#eab308' },
                    'safe': { text: 'text-green-400', circle: '#22c55e' },
                    'very_safe': { text: 'text-emerald-400', circle: '#10b981' }
                };
                const ui = colors[data.status] || colors['moderate'];
                
                const msgEl = document.getElementById('resMsg');
                msgEl.className = `text-2xl font-bold mb-2 ${ui.text}`;
                msgEl.innerText = data.msg;
                
                // อัปเดตวงกลมคะแนน (เส้นรอบวงคือ 283)
                const circle = document.getElementById('scoreCircle');
                circle.style.stroke = ui.circle;
                const offset = 283 - (283 * data.score / 100);
                circle.style.strokeDashoffset = offset;
                
                // อัปเดตตัวเลขคะแนน
                document.getElementById('scoreText').innerText = data.score;
                document.getElementById('scoreText').style.color = ui.circle;
                
                // แสดง Badge ถ้าคำนวณจริง
                const badge = document.getElementById('exactBadge');
                if (data.is_exact) badge.classList.remove('hidden');
                else badge.classList.add('hidden');
                
                // แสดงรายละเอียด
                let html = '';
                data.explanations.forEach(ex => {
                    html += `<div class="flex items-start gap-2 border-b border-slate-700/50 pb-2 last:border-0 last:pb-0">
                        <span class="text-lg">${ex.icon}</span>
                        <span class="leading-relaxed">${ex.text}</span>
                    </div>`;
                });
                document.getElementById('expList').innerHTML = html;
                
            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
