<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA Security Checker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }
        label { display: block; margin-top: 20px; font-weight: 600; color: #444; }
        input {
            width: 100%; padding: 15px; margin-top: 8px;
            border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 16px; transition: border 0.3s;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%; padding: 15px; margin-top: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 18px; font-weight: 600; cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .result {
            margin-top: 30px; padding: 25px;
            border-radius: 15px; animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .danger { background: #ffebee; border-left: 5px solid #f44336; }
        .warning { background: #fff3e0; border-left: 5px solid #ff9800; }
        .moderate { background: #fff9c4; border-left: 5px solid #fbc02d; }
        .safe { background: #e8f5e9; border-left: 5px solid #4caf50; }
        .result h3 { margin-bottom: 10px; color: #333; }
        .stats { margin-top: 15px; font-size: 14px; color: #666; }
        .nav-links {
            text-align: center; margin-top: 25px;
            padding-top: 20px; border-top: 1px solid #eee;
        }
        .nav-links a {
            color: #667eea; text-decoration: none;
            font-weight: 600; margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 RSA Security Checker</h1>
        <p class="subtitle">ตรวจสอบความปลอดภัยของกุญแจ RSA ด้วยข้อมูลจากการทดลอง Fermat Factorization</p>
        
        <form id="checkForm">
            <label>ค่า n (กุญแจสาธารณะ):</label>
            <input type="number" id="n" required placeholder="เช่น 12345678901234567">
            
            <label>ระยะห่าง p, q โดยประมาณ (D%):</label>
            <input type="number" id="D" value="50" min="0" max="100">
            
            <button type="submit">ตรวจสอบความปลอดภัย</button>
        </form>
        
        <div id="result"></div>
        
        <div class="nav-links">
            <a href="/dashboard">📊 Dashboard</a>
        </div>
    </div>

    <script>
        document.getElementById('checkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const n = document.getElementById('n').value;
            const D = document.getElementById('D').value;
            
            const res = await fetch('/api/check', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({n: n, D: D})
            });
            const data = await res.json();
            
            const el = document.getElementById('result');
            el.className = 'result ' + data.status;
            el.innerHTML = `
                <h3>${data.msg}</h3>
                ${data.avg_k ? `<p>จำนวนรอบ k ≈ ${data.avg_k.toLocaleString()}</p>` : ''}
                ${data.digits ? `<p class="stats">n มี ${data.digits} หลัก | เทียบกับ D = ${data.D_used}%</p>` : ''}
            `;
        });
    </script>
</body>
</html>
