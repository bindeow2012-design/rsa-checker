<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA Security Checker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', 'Sarabun', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; display: flex; align-items: center; justify-content: center; }
        .container { background: white; border-radius: 20px; padding: 40px; max-width: 800px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }
        label { display: block; margin-top: 20px; font-weight: 600; color: #444; }
        input { width: 100%; padding: 15px; margin-top: 8px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; font-family: monospace; }
        input:focus { outline: none; border-color: #667eea; }
        button { width: 100%; padding: 15px; margin-top: 25px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: 600; cursor: pointer; }
        button:hover { transform: translateY(-2px); }
        
        /* Safety Bar */
        .result-box { margin-top: 30px; padding: 25px; border-radius: 15px; display: none; }
        .result-box.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .danger { background: #ffebee; border: 2px solid #f44336; }
        .warning { background: #fff3e0; border: 2px solid #ff9800; }
        .moderate { background: #fff9c4; border: 2px solid #fbc02d; }
        .safe { background: #e8f5e9; border: 2px solid #4caf50; }
        .very_safe { background: #e0f2f1; border: 2px solid #009688; }
        
        .bar-container { width: 100%; height: 12px; background: #e0e0e0; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 10px; transition: width 1s ease-in-out; }
        
        .exp-item { padding: 10px 0; display: flex; gap: 10px; border-bottom: 1px dashed rgba(0,0,0,0.1); font-size: 15px; color: #444; }
        .exp-icon { font-size: 20px; }
        .nav-links { text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; }
        .nav-links a { color: #667eea; text-decoration: none; font-weight: 600; margin: 0 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 RSA Security Checker</h1>
        <p class="subtitle">ระบบตรวจสอบความปลอดภัยด้วยการคำนวณจริง (Exact) และฐานข้อมูล Fermat Factorization</p>
        
        <form id="checkForm">
            <label>ค่า n (กุญแจสาธารณะ):</label>
            <input type="text" id="n" required placeholder="เช่น 16867 หรือ 12345678901234567">
            
            <label>ระยะห่าง p, q โดยประมาณ (D%):</label>
            <input type="number" id="D" value="50" min="0" max="100">
            
            <button type="submit" id="submitBtn">ตรวจสอบความปลอดภัย</button>
        </form>
        
        <div id="resultBox" class="result-box">
            <h3 id="resMsg" style="margin-bottom: 10px; font-size: 22px;"></h3>
            
            <div class="bar-container">
                <div id="safetyBar" class="bar-fill" style="width: 0%;"></div>
            </div>
            
            <div id="expList" style="margin-top: 20px;"></div>
        </div>
        
        <div class="nav-links">
            <a href="/dashboard">📊 Dashboard</a>
        </div>
    </div>

    <script>
        document.getElementById('checkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
            
            const n = document.getElementById('n').value.trim();
            const D = document.getElementById('D').value;
            
            try {
                const res = await fetch('/api/check', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({n: n, D: parseInt(D)})
                });
                const data = await res.json();
                
                if (data.status === 'error') { alert(data.msg); return; }
                
                const box = document.getElementById('resultBox');
                box.className = 'result-box active ' + data.status;
                document.getElementById('resMsg').innerHTML = data.msg;
                
                // อัปเดต Safety Bar
                const bar = document.getElementById('safetyBar');
                bar.style.width = data.score + '%';
                if (data.score < 30) bar.style.background = '#f44336';
                else if (data.score < 60) bar.style.background = '#ff9800';
                else if (data.score < 85) bar.style.background = '#fbc02d';
                else bar.style.background = '#4caf50';
                
                // อัปเดตคำอธิบาย
                let html = '';
                data.explanations.forEach(ex => {
                    html += `<div class="exp-item"><span class="exp-icon">${ex.icon}</span><span>${ex.text}</span></div>`;
                });
                document.getElementById('expList').innerHTML = html;
                
            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message);
            } finally {
                btn.disabled = false; btn.textContent = 'ตรวจสอบความปลอดภัย';
            }
        });
    </script>
</body>
</html>
